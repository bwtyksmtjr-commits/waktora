<!DOCTYPE html>

    <title>WAKTORA | اتصل بنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --gold: #d4af37; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-top: 60px; padding-bottom: 70px; text-align: center; }
        
        header { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(20,20,20,0.95); display: flex; justify-content: center; align-items: center; border-bottom: 1px solid var(--gold); z-index: 1000;}
        .logo { font-size: 22px; font-weight: 800; }
        .logo span { color: var(--gold); }

        .content { padding: 40px 20px; max-width: 600px; margin: 0 auto; }
        .content h1 { color: var(--gold); font-size: 28px; margin-bottom: 30px; }
        
        .contact-card { background: #141414; border: 1px solid #222; padding: 20px; border-radius: 10px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; text-decoration: none; color: var(--text); transition: 0.3s; }
        .contact-card:hover { border-color: var(--gold); }
        .contact-card i { font-size: 30px; color: var(--gold); font-style: normal;}
        .contact-card div { text-align: right; }
        .contact-card h3 { font-size: 16px; margin-bottom: 5px; }
        .contact-card p { font-size: 14px; color: #aaa; }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #111; border-top: 1px solid var(--gold); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav a { display: flex; flex-direction: column; align-items: center; color: #888; text-decoration: none; font-size: 11px; gap: 4px; width: 20%; }
        .nav a i { font-size: 20px; font-style: normal; }
        .nav a.active { color: var(--gold); }
    </style>
</head>
