backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "المنتجات (الساعات)"
    folder: "_products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "اسم الساعة", name: "title", widget: "string" }
      - { label: "السعر (ر.س)", name: "price", widget: "number" }
      - { label: "صورة الساعة", name: "image", widget: "image" }
      - { label: "الوصف المختصر", name: "description", widget: "text", required: false }
